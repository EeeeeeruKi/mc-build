name: Build Mod
run-name: "Build (${{ inputs.gradle_task || 'build' }}) on ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      java_version:
        description: "Java version (1.20.5+ → 21, 1.18〜1.20.4 → 17, 〜1.16 → 8)"
        required: false
        default: "21"
      gradle_task:
        description: "Gradle task"
        required: false
        default: "build"
      release:
        description: "成功したjarを dev-build リリースに置く（スマホから直接ダウンロード用）"
        required: false
        type: choice
        options: ["yes", "no"]
        default: "yes"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version || '21' }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Gradle build
        id: build
        shell: bash
        env:
          TASK: ${{ inputs.gradle_task || 'build' }}
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew $TASK --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      - name: Report build errors
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          ws = os.environ["GITHUB_WORKSPACE"].rstrip("/") + "/"
          try:
              lines = open("build.log", encoding="utf-8", errors="replace").read().splitlines()
          except FileNotFoundError:
              lines = []
          ansi = re.compile(r"\x1b\[[0-9;]*[A-Za-z]")
          lines = [ansi.sub("", l) for l in lines]

          def esc(s):  # message escaping
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          def escp(s):  # property escaping
              return esc(s).replace(":", "%3A").replace(",", "%2C")

          java_re = re.compile(r"^(/\S+\.java):(\d+): error: (.*)$")
          kt_re = re.compile(r"^e: (?:file://)?(/\S+\.kts?):(\d+):(\d+) (.*)$")
          errors = []
          for i, l in enumerate(lines):
              m = java_re.match(l)
              if m:
                  path, line, msg = m.group(1), m.group(2), m.group(3)
                  # javacは次の行にソース行を出すので添える
                  if i + 1 < len(lines) and lines[i + 1].strip():
                      msg += "\n" + lines[i + 1].rstrip()
                  errors.append((path, line, None, msg))
                  continue
              m = kt_re.match(l)
              if m:
                  errors.append((m.group(1), m.group(2), m.group(3), m.group(4)))

          # GitHubの上限: 1ステップにつきerror注釈は10件まで → コンパイルエラー9件 + 概要1件
          for path, line, col, msg in errors[:9]:
              rel = path[len(ws):] if path.startswith(ws) else path
              props = f"file={escp(rel)},line={line}"
              if col:
                  props += f",col={col}"
              print(f"::error {props},title=Compile error::{esc(msg)}")

          summary = []
          if "* What went wrong:" in lines:
              start = lines.index("* What went wrong:") + 1
              for l in lines[start:]:
                  if l.startswith("* Try:") or l.startswith("* Exception is:"):
                      break
                  summary.append(l)
          if not summary:
              summary = lines[-40:]
          text = "\n".join(summary).strip()[:6000] or "ビルドに失敗しました（ログを確認してください）"
          if len(errors) > 9:
              text = f"コンパイルエラー {len(errors)} 件（先頭9件のみ表示）\n\n" + text
          print(f"::error title=Gradle::{esc(text)}")
          PY

      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
            !**/build/libs/*-javadoc.jar
            !**/build/libs/*-dev*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Publish dev-build release
        if: success() && inputs.release != 'no'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar nullglob
          files=()
          for f in **/build/libs/*.jar; do
            case "$f" in *-sources.jar|*-javadoc.jar|*-dev*.jar) continue;; esac
            files+=("$f")
          done
          [ ${#files[@]} -gt 0 ] || { echo "jarが見つかりません"; exit 1; }
          gh release delete dev-build --cleanup-tag -y 2>/dev/null || true
          gh release create dev-build "${files[@]}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Dev build (${GITHUB_REF_NAME} @ ${GITHUB_SHA::7})" \
            --notes "run:${GITHUB_RUN_ID}"
